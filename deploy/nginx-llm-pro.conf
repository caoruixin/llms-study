# ============================================================================
# 此文件为【目标态参考】,不直接部署——上机与 /etc/nginx/sites-enabled/ 现网配置
# 手工比对、按阶段增量应用(改完 nginx -t && systemctl reload nginx):
#   P0 阶段:只加 upstream llms_api 与 location /api/app/ 两块,其余一律不动;
#   P2 阶段(后端网关就绪 + 前端已发版):再把 5 条 /api/{provider}/ 从直连上游
#   改指后端、删除 map 注入的 key(整个 map 块与 llm_proxy_common.conf 作废)、
#   限流放宽到 30r/m。顺序必须:后端上线 → 前端发版 → 最后翻 nginx。
# 基线:2026-08 现网配置(certbot 管理的 ssl 行原样保留)。
# ============================================================================

# 后端单进程,仅本机回环;keepalive 减少高频短请求的握手开销
upstream llms_api {
    server 127.0.0.1:8787;
    keepalive 16;
}

# /api/{provider}/ 限流:P2 后端已强制登录,IP 限流只作粗防护,放宽到 30r/m
limit_req_zone $binary_remote_addr zone=llmapi_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=llmapi_conn:10m;

server {
    server_name llm-pro.cn www.llm-pro.cn;

    root /var/www/llms-study;
    index index.html;

    limit_req_status 429;
    limit_conn_status 429;

    # HashRouter,路由都在 # 后;fallback 仅兜底
    location / {
        try_files $uri /index.html;
    }

    # index.html 不缓存(每次条件校验,发版立即生效,未变则 304)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 后端业务 API(P0 起) ----
    # 10m:同步 push 批上限 8MB(shared/apiRoutes.ts SYNC_PUSH_MAX_BYTES)+ 头部余量;
    # 精确的 8MB 闸在后端,nginx 只挡明显超标的
    location /api/app/ {
        client_max_body_size 10m;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 论文原始文件上传/下载(P3 起):50MB 级 body,直接流给后端不在 nginx 落盘
    location /api/app/files/ {
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- LLM 代理(P2 起改指后端;后端做鉴权 + 按用户注入 key) ----
    # SSE 流式:proxy_buffering off 必须,配合后端 X-Accel-Buffering: no 双保险;
    # X-User-Key 清空是纵深防御(后端也会 strip 入站鉴权头)
    location /api/deepseek/ {
        limit_req zone=llmapi_req burst=6 nodelay;
        limit_conn llmapi_conn 4;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/moonshot/ {
        limit_req zone=llmapi_req burst=6 nodelay;
        limit_conn llmapi_conn 4;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/zhipu/ {
        limit_req zone=llmapi_req burst=6 nodelay;
        limit_conn llmapi_conn 4;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/jina/ {
        limit_req zone=llmapi_req burst=6 nodelay;
        limit_conn llmapi_conn 4;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/openai-compat/ {
        limit_req zone=llmapi_req burst=6 nodelay;
        limit_conn llmapi_conn 4;
        proxy_pass http://llms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-Key "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    # 2026-08-24 慢加载 RCA:HTTP/1.1 串行 + JS 未压缩(nginx 1.25+ mime 是
    # text/javascript,全局 gzip_types 没列它)是跨境首屏 60s+ 的元凶之二。
    # gzip_static 直接回源构建期预压缩的 .gz(scripts/precompress.mjs,级别 9)。
    # 全局 nginx.conf 的 gzip_types 也已补 text/javascript + gzip_comp_level 6。
    http2 on;
    gzip_static on;
    ssl_certificate /etc/letsencrypt/live/llm-pro.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/llm-pro.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.llm-pro.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = llm-pro.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name llm-pro.cn www.llm-pro.cn;
    return 301 https://llm-pro.cn$request_uri;
}
